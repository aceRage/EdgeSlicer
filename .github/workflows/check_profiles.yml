name: Check profiles
on: 
  pull_request:
    branches: 
    - main 
    paths:
    - 'resources/profiles/**'
    - ".github/workflows/check_profiles.yml"

  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'     
        required: true
        default: 'warning'


jobs:
  check_translation:
    name: Check profiles
    runs-on: ubuntu-24.04
    steps:  
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run extra JSON check
        run: |
          python3 ./scripts/orca_extra_profile_check.py

      # download
      - name: Download 
        working-directory: ${{ github.workspace }}
        run: |
          curl -LJO https://github.com/SoftFever/Orca_tools/releases/download/1/OrcaSlicer_profile_validator
          chmod +x ./OrcaSlicer_profile_validator

      # validate profiles
      # The prebuilt upstream validator does not know the TPU285 nozzle volume type
      # (Bambu H3C). EdgeSlicer's loader does, so validate a scratch copy with that one
      # value read as Standard. Drop this once the upstream validator learns TPU285.
      - name: validate system profiles
        run: |
          rm -rf "${{ runner.temp }}/profiles"
          cp -r ${{ github.workspace }}/resources/profiles "${{ runner.temp }}/profiles"
          find "${{ runner.temp }}/profiles" -path '*/machine/*.json' -exec sed -i 's/"TPU285"/"Standard"/g' {} +
          ./OrcaSlicer_profile_validator -p "${{ runner.temp }}/profiles" -l 2




