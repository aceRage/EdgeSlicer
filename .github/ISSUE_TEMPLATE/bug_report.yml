name: 🐞 Bug report
description: Something in EdgeSlicer doesn't work as it should
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        - Please check the [latest release](https://github.com/aceRage/EdgeSlicer/releases/latest) first; it may already be fixed.
        - Search [existing issues](https://github.com/aceRage/EdgeSlicer/issues?q=is%3Aissue) (open and closed). If you find yours, add a comment there instead.
        - Questions and setup help go to [Discord](https://discord.gg/vn763fC79M).

        **Privacy:** logs and project files can contain printer serial numbers, IP addresses, access codes and your username. Please remove them before uploading, or say so and we'll ask for them privately.
  - type: checkboxes
    attributes:
      label: Existing issues
      options:
        - label: I searched the existing issues and this hasn't been reported yet
          required: true
  - type: input
    id: version
    attributes:
      label: EdgeSlicer version
      description: "`Help` → `About EdgeSlicer`."
      placeholder: e.g. 2.4.7.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      multiple: true
      options:
        - Windows
        - macOS (Apple silicon)
        - macOS (Intel)
        - Linux
    validations:
      required: true
  - type: input
    id: os_version
    attributes:
      label: OS version
      placeholder: e.g. Windows 11 24H2, macOS 15.1, Ubuntu 24.04
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Where does the problem happen?
      multiple: true
      options:
        - Slicing / G-code (wrong output, failed slice, print quality caused by the slicer)
        - Prepare / 3D view (models, cut, emboss, painting, supports)
        - Preview
        - Showcase (renders, videos, callouts)
        - Sending to a printer / printer connection
        - Device / Monitor tab, camera, Stream tab
        - Phone hub / companion app / remote access
        - Printer or filament profiles
        - Installation, updates, startup or crash
        - Other
    validations:
      required: true
  - type: input
    id: printer
    attributes:
      label: Printer
      description: The printer profile selected, and the real printer if different.
      placeholder: e.g. Snapmaker U1, Bambu Lab H2D, Elegoo Centauri Carbon + CANVAS, Voron 2.4
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection (if the bug involves a printer)
      options:
        - Not related to a printer connection
        - Bambu Lab LAN
        - Bambu Lab cloud
        - Snapmaker (U1 / J1 / Artisan)
        - Klipper / Moonraker
        - OctoPrint
        - Elegoo (Centauri Carbon / CANVAS)
        - QIDI
        - Flashforge
        - Other
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the attached project
        2. Select '...'
        3. Click '...'
        4. See the problem
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Screenshots or a short video help a lot, even when the description seems clear.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: dropdown
    id: regression
    attributes:
      label: Did this work in an earlier version?
      options:
        - Don't know
        - "No, it never worked"
        - Yes (please say which version in the notes below)
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        ### Files that help us fix it fast
        - **Project file:** `File` → `Save project as…`, then zip the `.3mf` and drop it below. Even with nothing on the plate, the project carries your settings.
        - **Logs** (for crashes, failed sends or anything odd): `Help` → `Show Configuration Folder`, open `log`, zip the newest files from when it happened.
          - Windows: `%APPDATA%\EdgeSlicer\log`
          - macOS: `~/Library/Application Support/EdgeSlicer/log`
          - Linux: `~/.config/EdgeSlicer/log`
        - **G-code**, if the problem is in the printed result.
  - type: textarea
    id: files
    attributes:
      label: Project file, logs and screenshots
      description: Drag and drop zipped files here.
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Anything else?
      description: Hardware (CPU, GPU, RAM) for performance or display problems, workarounds you found, related issues.
    validations:
      required: false
