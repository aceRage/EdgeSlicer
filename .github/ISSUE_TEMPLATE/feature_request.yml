name: 🚀 Feature request
description: Suggest a new feature or an improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! If it's still loose, [Discussions](https://github.com/aceRage/EdgeSlicer/discussions) or [Discord](https://discord.gg/vn763fC79M) are good places to shape it first.

        If the feature already exists in OrcaSlicer or Bambu Studio, please say so and link it; that makes it much easier to bring over.
  - type: checkboxes
    attributes:
      label: Existing requests
      options:
        - label: I searched the existing issues and this hasn't been requested yet
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      placeholder: When I print [...], I have to [...], which is slow / error-prone because [...]
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
      description: Describe the feature as you'd use it. Sketches or screenshots welcome.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Slicing / print settings
        - Prepare / modelling tools
        - Preview
        - Showcase
        - Printer connection / sending
        - Device / Monitor / cameras
        - Phone app / hub / remote access
        - Profiles
        - Other
    validations:
      required: true
  - type: dropdown
    id: printers
    attributes:
      label: Which printers would benefit?
      multiple: true
      options:
        - All printers
        - Bambu Lab
        - Snapmaker
        - Elegoo
        - QIDI
        - Flashforge
        - Klipper / Moonraker printers
        - Marlin printers
        - Other
    validations:
      required: true
  - type: input
    id: upstream
    attributes:
      label: Exists elsewhere?
      description: Link to the same feature in OrcaSlicer, Bambu Studio, PrusaSlicer, Cura… if any.
      placeholder: https://github.com/OrcaSlicer/OrcaSlicer/pull/...
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds you've tried
    validations:
      required: false
